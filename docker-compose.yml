# ─────────────────────────────────────────────────────────────────────────────
# Pre-deploy checklist (run once on the Swarm manager)
# ─────────────────────────────────────────────────────────────────────────────
#  1. NFS-Share mounten (falls noch nicht geschehen, siehe mealplaner/taster):
#       sudo mkdir -p /volume1/cloudstorage
#       echo "192.168.178.62:/volume1/cloudstorage /volume1/cloudstorage nfs nfsvers=4,hard,intr,noac,_netdev,nofail 0 0" | sudo tee -a /etc/fstab
#       sudo mount -a
#
#  2. Datenverzeichnis auf der NAS anlegen (einmalig, auf Pi1):
#       sudo mkdir -p /volume1/cloudstorage/docker-swarm-data/calories
#       sudo chmod 777 /volume1/cloudstorage/docker-swarm-data/calories
#
#  3. Deployen:
#       docker build --platform linux/arm64 -t calories:latest .
#       docker stack deploy -c docker-compose.yml calories
#
#  Erreichbar unter: http://pi1:3003
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    image: calories:latest
    environment:
      PORT: "3003"
      DB_PATH: /data/calories.db
      OFF_MODE: ${OFF_MODE:-live}
    volumes:
      - sqlite-data:/data
    networks:
      - internal
    ports:
      - target: 3003
        published: 3003
        mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/api/persons"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager

networks:
  internal:
    driver: overlay
    attachable: true

volumes:
  sqlite-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/cloudstorage/docker-swarm-data/calories
